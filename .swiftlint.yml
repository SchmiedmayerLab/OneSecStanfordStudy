excluded:
  - .build
  - .swiftpm
  - .derivedData
  - Tests/UITests/.derivedData

disabled_rules:
  - blanket_disable_command

line_length:
  warning: 150
  error: 150

vertical_whitespace:
  max_empty_lines: 2

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: true
