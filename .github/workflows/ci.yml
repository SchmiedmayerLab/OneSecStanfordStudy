name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  setup:
    name: Set Up Swift Package
    uses: SchmiedmayerLab/.github/.github/workflows/swift-package-setup.yml@v0.5

  tests:
    name: Test Swift Package
    needs: setup
    uses: SchmiedmayerLab/.github/.github/workflows/swift-package-test.yml@v0.5
    with:
      package_name: ${{ needs.setup.outputs.package_name }}
      scheme: ${{ needs.setup.outputs.scheme }}
      platform_matrix: ${{ needs.setup.outputs.platform_matrix }}
      ui_platform_matrix: ${{ needs.setup.outputs.ui_platform_matrix }}
    secrets: inherit

  analysis:
    name: Analyze Swift Package
    needs: setup
    uses: SchmiedmayerLab/.github/.github/workflows/swift-package-static-analysis.yml@v0.5
    with:
      library_products: ${{ needs.setup.outputs.library_products }}
      platform_name: ${{ needs.setup.outputs.platform_name }}
      platform_version: ${{ needs.setup.outputs.platform_version }}
      diagnose_breaking_changes: false

  api-compatibility:
    name: Check API Compatibility
    if: github.ref != 'refs/heads/main'
    runs-on: [macOS, self-hosted]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for unapproved API changes
        run: bash Scripts/check-api-compatibility.sh origin/main

  all-tests-pass:
    name: All tests pass
    if: always()
    needs: [setup, tests, analysis, api-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(
            .value.result == "success" or
            (.key == "api-compatibility" and .value.result == "skipped")
          )'
          echo "All required checks passed."
